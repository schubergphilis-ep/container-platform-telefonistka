name: Docker

on:
  release:
    types: [published]
  pull_request:
    branches: ["main"]

jobs:
  build:
    env:
      CGO_ENABLED: 0
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - run: echo epoch=$(date +%s) > $GITHUB_OUTPUT
        id: time
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-mod-v1-${{ github.ref_name }}-${{ hashFiles('go.mod') }}-${{ steps.time.outputs.epoch }}
          restore-keys: |
            go-mod-v1-${{ github.ref_name }}-${{ hashFiles('go.mod') }}
            go-mod-v1-${{ github.ref_name }}-
            go-mod-v1-${{ github.event.repository.default_branch }}-${{ hashFiles('go.mod') }}
            go-mod-v1-${{ github.event.repository.default_branch }}-
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod tidy -diff
      - run: go test -v ./...
      - run: go test -v -bench . -run "^$" ./...
      - run: go build -o telefonistka .
      - uses: actions/cache/save@v4
        with:
          key: go-mod-v1-${{ github.ref_name }}-${{ hashFiles('go.mod') }}-${{ steps.time.outputs.epoch }}
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod

      #
      # Build, scan and push the scratch (default) image.
      #
      - name: Build and push Docker image
        uses: schubergphilis/mcvs-docker-action@v0.11.0
        with:
          images: docker.io/schubergphilis/container-platform-telefonistka
          push-to-container-registry: ${{ github.event_name != 'pull_request' && 'dockerhub' || '' }}
          dockerhub-username: schubergphilis
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}

      #
      # Build, scan and push the alpine image.
      # mcvs-docker-action does not support Dockerfile --target, so we build
      # the alpine variant manually after the action has run its checks.
      #
      - name: Extract Docker metadata (alpine)
        if: github.event_name != 'pull_request'
        id: meta-alpine
        uses: docker/metadata-action@v5.10.0
        with:
          images: docker.io/schubergphilis/container-platform-telefonistka
          flavor: prefix=alpine-,onlatest=true

      - name: Build and push Docker image (alpine)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          target: alpine-release
          push: true
          tags: ${{ steps.meta-alpine.outputs.tags }}
          labels: ${{ steps.meta-alpine.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
